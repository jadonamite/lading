<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="An engraved documentary credit with its seal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04110d"/>
      <stop offset="55%" stop-color="#071b18"/>
      <stop offset="100%" stop-color="#04141c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2320" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08191c" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="guilloche" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 7h14" stroke="#10b981" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <rect width="800" height="600" fill="url(#guilloche)"/>

  <!-- the credit itself, set at an angle as a document on a desk -->
  <g transform="translate(150 78) rotate(-4)">
    <rect x="0" y="0" width="470" height="452" rx="6" fill="url(#paper)" stroke="#10b981" stroke-opacity="0.28"/>
    <rect x="16" y="16" width="438" height="420" rx="3" fill="none" stroke="#10b981" stroke-opacity="0.16"/>

    <!-- heading -->
    <text x="44" y="66" font-family="Georgia, serif" font-style="italic" font-size="27" fill="#d1fae5" fill-opacity="0.92">Documentary Credit</text>
    <text x="44" y="90" font-family="ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#5eead4" fill-opacity="0.62">IRREVOCABLE · UCP 600</text>
    <line x1="44" y1="104" x2="426" y2="104" stroke="#10b981" stroke-opacity="0.25"/>

    <!-- terms, as ruled lines with values -->
    <g font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" fill-opacity="0.85">
      <text x="44" y="136">APPLICANT</text><text x="250" y="136" fill="#e2e8f0" fill-opacity="0.75">0x40f2…7ce2</text>
      <text x="44" y="166">BENEFICIARY</text><text x="250" y="166" fill="#e2e8f0" fill-opacity="0.75">0x7099…79C8</text>
      <text x="44" y="196">FACE AMOUNT</text><text x="250" y="196" fill="#6ee7b7">12.500000 USDT</text>
      <text x="44" y="226">EXPIRY</text><text x="250" y="226" fill="#e2e8f0" fill-opacity="0.75">2026-08-22 16:59Z</text>
    </g>
    <g stroke="#10b981" stroke-opacity="0.13">
      <line x1="44" y1="146" x2="426" y2="146"/>
      <line x1="44" y1="176" x2="426" y2="176"/>
      <line x1="44" y1="206" x2="426" y2="206"/>
      <line x1="44" y1="236" x2="426" y2="236"/>
    </g>

    <!-- the conditions: the part a bank actually examines -->
    <text x="44" y="272" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2.5" fill="#5eead4" fill-opacity="0.62">CONDITIONS</text>
    <g font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1" fill-opacity="0.7">
      <text x="44" y="298">quantity        =   500</text>
      <text x="44" y="322">latestShipDate  ≤   22 AUG</text>
      <text x="44" y="346">consigneeId     =   0xC0FFEE</text>
    </g>

    <!-- ruled remainder, suggesting the rest of the document -->
    <g stroke="#94a3b8" stroke-opacity="0.10">
      <line x1="44" y1="376" x2="426" y2="376"/>
      <line x1="44" y1="394" x2="380" y2="394"/>
      <line x1="44" y1="412" x2="404" y2="412"/>
    </g>
  </g>

  <!-- the seal, struck over the corner of the document -->
  <g transform="translate(556 404)">
    <circle r="66" fill="#04110d" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="55" fill="none" stroke="#10b981" stroke-opacity="0.32"/>
    <circle r="44" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-dasharray="3 5"/>
    <text y="-8" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#6ee7b7" fill-opacity="0.9">HONOURED</text>
    <text y="12" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#d1fae5" fill-opacity="0.92">no bank</text>
    <text y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.5" fill="#5eead4" fill-opacity="0.55">BOT CHAIN · 677</text>
  </g>
</svg>
