[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 1024

[rpc_endpoints]
botchain = "https://rpc.botchain.ai/"

[etherscan]
botchain = { key = "blockscout", chain = 677, url = "https://scan.botchain.ai/api" }
